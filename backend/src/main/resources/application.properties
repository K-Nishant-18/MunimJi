spring.application.name=MunimJi

# ---------------------------------------------------------------------------
# Database
# Default: H2 file database, data stored in backend/data/ (no install needed).
# To run on MySQL instead, set these environment variables:
#   DB_DRIVER=com.mysql.cj.jdbc.Driver
#   DB_URL=jdbc:mysql://localhost:3306/munimji?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#   DB_USERNAME=root
#   DB_PASSWORD=your_mysql_password
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/munimji;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# data.sql runs after Hibernate has created/updated the schema.
# Set SEED_MODE=never once you do not want the sample data to be inserted.
spring.sql.init.mode=${SEED_MODE:always}

# ---------------------------------------------------------------------------
# JWT (never hard-code secrets in Java; override with the JWT_SECRET env var)
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:munimji-local-dev-secret-key-change-me-before-production-0123456789}
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------------
# Shop details printed on the PDF invoice (override with env variables)
# ---------------------------------------------------------------------------
shop.name=${SHOP_NAME:Sharma Kirana Store}
shop.gstin=${SHOP_GSTIN:23AAAAA0000A1Z5}
shop.address=${SHOP_ADDRESS:12 Main Bazaar Road, Indore, Madhya Pradesh}
shop.phone=${SHOP_PHONE:9876543210}

server.port=8080
