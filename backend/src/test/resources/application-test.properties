# Profile used only by JUnit tests: in-memory H2 so tests never touch the
# dev file database (backend/data/) and always start from the same seed.
spring.datasource.url=jdbc:h2:mem:munimji-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
